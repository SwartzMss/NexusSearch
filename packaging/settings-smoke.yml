# SPDX-License-Identifier: AGPL-3.0-or-later
use_default_settings:
  engines:
    keep_only:
      - "nexussearch demo"

general:
  debug: false
  instance_name: "NexusSearch"

search:
  formats:
    - html
    - json

server:
  bind_address: "127.0.0.1"
  port: 8788
  limiter: false
  public_instance: false
  image_proxy: false
  secret_key: "nexussearch-portable-runtime"

valkey:
  url: false

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true

  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false

  searx.plugins.hash_plugin.SXNGPlugin:
    active: true

  searx.plugins.self_info.SXNGPlugin:
    active: true

  searx.plugins.unit_converter.SXNGPlugin:
    active: true

  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true

  searx.plugins.hostnames.SXNGPlugin:
    active: true

  searx.plugins.time_zone.SXNGPlugin:
    active: true

  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false

  searx.plugins.tor_check.SXNGPlugin:
    active: false

  # Deliberately omitted: the portable backend does not need tracker-rule fetches.

engines:
  - name: "nexussearch demo"
    engine: nexussearch_demo
    shortcut: nsdemo
    disabled: false
